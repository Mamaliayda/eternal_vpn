name: Android APK

on:
  push:
    branches:
      - 'arena/66c2c056-eternal-vpn'
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '17'

jobs:
  build:
    name: Build installable APKs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11479570'
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APKs (test signing key)
        shell: bash
        run: |
          set +e
          java -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain :app:assembleRelease -PmlmTestSign --stacktrace --console=plain > build-output.log 2>&1
          result=$?
          cat build-output.log
          exit "$result"

      - name: Annotate build errors
        if: failure()
        shell: bash
        run: |
          if [[ -f build-output.log ]]; then
            {
              grep -E '(^e: |error:|FAILURE:|Execution failed for task|Could not resolve)' build-output.log | head -15
              awk '/What went wrong:/{emit=1; count=0} emit && count++ < 28 {print}' build-output.log
            } | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
          else
            echo 'Gradle failed before producing a build log.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload build log for troubleshooting
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: build-output.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Collect APKs and checksums
        shell: bash
        run: |
          mkdir -p dist-apk
          find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -exec cp {} dist-apk/ \;
          test -n "$(find dist-apk -maxdepth 1 -type f -name '*.apk' -print -quit)"
          (cd dist-apk && sha256sum *.apk > SHA256SUMS.txt)

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: eternal-vpn-android-apks
          path: dist-apk/*
          if-no-files-found: error
          retention-days: 30
