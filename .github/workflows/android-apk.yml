name: Android APK

on:
  push:
    branches:
      - 'arena/66c2c056-eternal-vpn'
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '17'

jobs:
  build:
    name: Build installable APKs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11479570'
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APKs (test signing key)
        run: >-
          java -classpath gradle/wrapper/gradle-wrapper.jar
          org.gradle.wrapper.GradleWrapperMain
          :app:assembleRelease -PmlmTestSign --stacktrace

      - name: Collect APKs and checksums
        shell: bash
        run: |
          mkdir -p dist-apk
          find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -exec cp {} dist-apk/ \;
          test -n "$(find dist-apk -maxdepth 1 -type f -name '*.apk' -print -quit)"
          (cd dist-apk && sha256sum *.apk > SHA256SUMS.txt)

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: eternal-vpn-android-apks
          path: dist-apk/*
          if-no-files-found: error
          retention-days: 30
