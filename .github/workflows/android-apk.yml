name: Android APK

on:
  push:
    branches:
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '17'

jobs:
  build:
    name: Build installable APKs
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: true

      # Build the exact Xray gomobile API this app uses. Keep the source commit pinned:
      # its generated AAR is intentionally not committed, and must match VlessXrayInjector.
      - name: Check out Xray Android library source
        uses: actions/checkout@v4
        with:
          repository: 2dust/AndroidLibXrayLite
          ref: 1314c9af79518a03300803019c8264c737bb3596
          path: xray-library

      # Windscribe's API client is a native C++ library distributed upstream as an AAR.
      # Build it from a pinned public source revision instead of relying on a missing binary.
      - name: Check out WSNet source
        uses: actions/checkout@v4
        with:
          repository: Windscribe/wsnet
          ref: aa297ca6a6d3238c236d42c165f7668ca897795d
          fetch-depth: 0
          path: wsnet

      - name: Check out WSNet vcpkg registry
        uses: actions/checkout@v4
        with:
          repository: Windscribe/ws-vcpkg-registry
          ref: 6e88a8e7aa1db0f0239f9b243c7667f2bbacf9a6
          path: ws-vcpkg-registry

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: xray-library/go.mod

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11479570'
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Build Xray Android library
        working-directory: xray-library
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260508232728-bebd421c7fa8
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init
          gomobile bind -v -androidapi 24 -trimpath -ldflags='-s -w -buildid=' ./
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          cp libv2ray.aar "$GITHUB_WORKSPACE/app/libs/libv2ray.aar"

      - name: Install pinned vcpkg for WSNet
        working-directory: ws-vcpkg-registry
        env:
          VCPKG_ROOT: ${{ runner.temp }}/vcpkg
        run: bash install-vcpkg/vcpkg_install.sh "$VCPKG_ROOT"

      - name: Build Windscribe WSNet Android library
        working-directory: wsnet/tools
        env:
          VCPKG_ROOT: ${{ runner.temp }}/vcpkg
        run: |
          ./build_android.sh
          cp wsnet.aar "$GITHUB_WORKSPACE/app/libs/wsnet.aar"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APKs (debug test key; non-production)
        shell: bash
        run: |
          set +e
          java -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain :app:assembleRelease -PtestSign --stacktrace --console=plain > build-output.log 2>&1
          result=$?
          cat build-output.log
          exit "$result"

      - name: Annotate build errors
        if: failure()
        shell: bash
        run: |
          if [[ -f build-output.log ]]; then
            {
              grep -E '(^e: |error:|FAILURE:|Execution failed for task|Could not resolve)' build-output.log | head -15
              awk '/What went wrong:/{emit=1; count=0} emit && count++ < 28 {print}' build-output.log
            } | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
          else
            echo 'Gradle failed before producing a build log.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload build log for troubleshooting
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: build-output.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Collect APKs and checksums
        shell: bash
        run: |
          mkdir -p dist-apk
          find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -exec cp {} dist-apk/ \;
          test -n "$(find dist-apk -maxdepth 1 -type f -name '*.apk' -print -quit)"
          (cd dist-apk && sha256sum *.apk > SHA256SUMS.txt)

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: eternal-vpn-android-apks
          path: dist-apk/*
          if-no-files-found: error
          retention-days: 30
